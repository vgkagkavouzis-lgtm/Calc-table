<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <thead>
            <tr class="header">
                <th class="main-col">Height</th>
                <th class="main-col">Score</th>
                <th class="main-col">Income</th>
                <th class="main-col">Age</th>
                <th class="btn-col"></th>
                <th class="btn-col"></th>
        </thead>
        <tbody>
            </tr class="inputs">
                <td><input class="input" type="text" placeholder="height.."></td>
                <td><input class="input" type="text" placeholder="Score.."></td>
                <td> <input class="input" type="text" placeholder="Income.."></td>
                <td><input class="input" type="text" placeholder="Age.."></td>
                <td><button><i class="fa-regular fa-copy"></i></button></td>
                <td><button><i class="fa-regular fa-trash-can fa-width-auto" style="color: rgb(252, 41, 8);"></i></button></td>
            </tr>
        </tbody>    
        <tfoot>
            <tr>
                <td class="select">
                    <select name="functions-height" class="functions-height" id="">
                        <option value="Max">Max</option>
                        <option value="Min">Min</option>
                        <option value="Avg">Avg</option>
                        <option value="Mode">Mode</option>
                        <option value="Median">Median</option>
                        <option value="Range">Range</option>
                        <option value="Variance">Variance</option>
                        <option value="StdDev">StdDev</option>
                    </select>
                </td>
                <td class="select">
                    <select name="functions-score" class="functions-score" id="">
                        <option value="Max">Max</option>
                        <option value="Min">Min</option>
                        <option value="Avg">Avg</option>
                        <option value="Mode">Mode</option>
                        <option value="Median">Median</option>
                        <option value="Range">Range</option>
                        <option value="Variance">Variance</option>
                        <option value="StdDev">StdDev</option>
                    </select>
                </td>
                <td class="select">
                    <select name="functions-income" class="functions-income" id="">
                        <option value="Max">Max</option>
                        <option value="Min">Min</option>
                        <option value="Avg">Avg</option>
                        <option value="Mode">Mode</option>
                        <option value="Median">Median</option>
                        <option value="Range">Range</option>
                        <option value="Variance">Variance</option>
                        <option value="StdDev">StdDev</option>
                    </select>
                </td>
                <td class="select">
                    <select name="functions-age" class="functions-age" id="">
                        <option value="Max">Max</option>
                        <option value="Min">Min</option>
                        <option value="Avg">Avg</option>
                        <option value="Mode">Mode</option>
                        <option value="Median">Median</option>
                        <option value="Range">Range</option>
                        <option value="Variance">Variance</option>
                        <option value="StdDev">StdDev</option>
                    </select>
                </td>
                <td></td>
                <td></td>
            </tr>
            <tr class="outcome">
                <td><p id="height">180</p></td>
                <td><p id="score">4000</p></td>
                <td><p id="income">1000</p></td>
                <td><p id="age">37</p></td>
                <td></td>
                <td></td>
            </tr>
        </tfoot>    
    </table>
